name: Compile time A/B

on:
  pull_request:
    branches: [v2, main]
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline git ref (must exist in this repository)
        required: true
      candidate:
        description: Candidate git ref (must exist in this repository)
        required: true
        default: v2

concurrency:
  group: compile-time-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  compile-time:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASELINE: ${{ github.event.pull_request.base.sha || inputs.baseline }}
      CANDIDATE: ${{ github.event.pull_request.head.sha || inputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harness contracts
        run: python3 tests/compile_time/test_compare.py
      - name: Compile-time comparison (C++23)
        run: |
          python3 tests/compile_time/compare.py --baseline "$BASELINE" --candidate "$CANDIDATE" \
            --translation-units 8 --json compile-time.json --markdown compile-time.md
      - name: Publish timing summary
        if: always()
        run: |
          for report in compile-time-*.md; do
            if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-time-ab
          path: compile-time-*
